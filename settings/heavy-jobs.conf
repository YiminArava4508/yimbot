# Commands that need the single heavy-job slot. One extended regex, matched
# against the command once heavy-queue.sh has peeled its wrappers: a leading
# `cd <path> &&`, env assignments, a subshell, a `bash -c` body. Anything not
# matching here runs immediately.
#
# Drawn from the gemini repo's Taskfiles and package.json scripts. Four groups:
#
#   task ...        an optional namespace (api:, mod-api:, env:) then a heavy
#                   verb, so api:generate, build-all, build:libs, env:build,
#                   test-integration, typecheck:apps and lint:libs all match.
#   pnpm / npm      install, compile (graphql-codegen), build and typecheck
#                   (both run under an 8GB heap in react-ui), lint, and test
#                   with an allow-list of suffixes.
#   go              build, test, vet and generate, which AGENTS.md names as the
#                   commands needing a 10-minute timeout.
#   direct tools    the underlying binaries, for when a session skips the task
#                   or script wrapper: gqlgen both as a bare binary and through
#                   `go run <module>`, golangci-lint, and graphql-codegen with
#                   or without a --config value.
#
# Deliberately NOT matched: anything long-running, because holding the slot on a
# command that never exits would stall every other session until HEAVY_MAX_JOB.
# That means `task env:start`, `task dev:up`, `task up`, `task up-ci`,
# `go run` other than gqlgen (usually serve-graphql), `pnpm dev`,
# `graphql-codegen -w` (which the trailing anchor excludes), and the
# `:watch`, `:ui` and `:debug` pnpm scripts stay out. Running one of the
# underlying binaries in watch mode by hand (`playwright test --ui`) is not
# caught; HEAVY_MAX_JOB bounds the damage if you do.
HEAVY_PATTERNS='^(task ([a-z0-9-]+:)*(clean-generate|generate|gqlgen|gen-|[a-z0-9-]*build|test|lint|typecheck|ci-local|merge-main|migrate|validate-go)|(pnpm|npm) ((-{1,2}[^ ]+ [^ ]+ |-{1,2}[^ ]+ )*)(run )?(install|compile|build|typecheck|lint|ts-libs|ts-apps)([:-][a-z0-9:-]*)?( |$)|(pnpm|npm) ((-{1,2}[^ ]+ [^ ]+ |-{1,2}[^ ]+ )*)(run )?test(:(libs|apps|scripts|devenv|coverage|ci|playwright|package:libs))?( |$)|go (build|test|vet|generate)|go run [^ ]*gqlgen|gqlgen( |$)|golangci-lint|graphql-codegen( --config[= ][^ ]+)?$|next build|tsc (-p|--noEmit)|vitest run|playwright test|docker (compose )?build|npx zx scripts/pre-push-native)'

# Seconds a session waits for the slot before giving up and running anyway.
# Giving up keeps a wedged queue from stalling the whole board.
HEAVY_WAIT_TIMEOUT=1200

# Seconds after which a running ticket is presumed dead and reaped. The flock
# itself is already gone by then; this only clears the ordering hint.
HEAVY_MAX_JOB=1800
